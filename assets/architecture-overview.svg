<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8px; }
      .box-highlight { fill: #161b22; stroke: #58a6ff; stroke-width: 2; rx: 8px; }
      .title { fill: #58a6ff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 600; }
      .label { fill: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 500; }
      .subtext { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .code { fill: #79c0ff; font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; }
      .arrow { stroke: #58a6ff; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .badge-green { fill: #238636; }
      .badge-blue { fill: #1f6feb; }
      .badge-purple { fill: #8957e5; }
      .badge-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#58a6ff" />
    </marker>
  </defs>

  <rect width="1000" height="480" class="bg" rx="12" />

  <text x="40" y="45" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">P6 &amp; Power BI Unified Agentic Mesh Architecture</text>
  <text x="40" y="68" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Closing the 14-Day Capital Megaproject Reporting Lag: Autonomous Schedule Ingestion, DCMA 14-Point, and Live DAX</text>

  <!-- Stage 1 -->
  <g transform="translate(40, 100)">
    <rect width="270" height="330" class="box" />
    <rect x="15" y="15" width="70" height="18" rx="4" class="badge-blue" />
    <text x="50" y="27" class="badge-text">STAGE 1</text>
    <text x="15" y="55" class="title">Primavera P6 Ingestion</text>
    <text x="15" y="75" class="subtext">SQLite &amp; .XER Autonomous Parser</text>

    <rect x="15" y="95" width="240" height="70" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="115" class="label">Real-Time Schedule Sync</text>
    <text x="25" y="132" class="subtext">• WBS hierarchy extraction</text>
    <text x="25" y="147" class="subtext">• Relationship links (FS, SS, FF, SF)</text>

    <rect x="15" y="175" width="240" height="70" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="195" class="label">Pathizer P7 Connector</text>
    <text x="25" y="212" class="code">CPM.forward_backward_pass()</text>
    <text x="25" y="227" class="subtext">• Sub-second critical path compute</text>

    <rect x="15" y="255" width="240" height="55" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="275" class="label">Telemetry Lag Elimination</text>
    <text x="25" y="292" class="code">Lag: 14 days → &lt; 3 seconds</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 310 250 L 350 250" class="arrow" />

  <!-- Stage 2 -->
  <g transform="translate(360, 100)">
    <rect width="280" height="330" class="box-highlight" />
    <rect x="15" y="15" width="70" height="18" rx="4" class="badge-purple" />
    <text x="50" y="27" class="badge-text">STAGE 2</text>
    <text x="15" y="55" class="title">DCMA &amp; Risk Modeling</text>
    <text x="15" y="75" class="subtext">14-Point Audit &amp; Monte Carlo P80</text>

    <rect x="15" y="95" width="250" height="75" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="115" class="label">DCMA 14-Point Quality Gate</text>
    <text x="25" y="132" class="subtext">• Logic, leads, lags, hard constraints</text>
    <text x="25" y="147" class="subtext">• SCL Delay Protocol 2nd Edition</text>

    <rect x="15" y="180" width="250" height="75" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="200" class="label">Monte Carlo P80 Simulation</text>
    <text x="25" y="218" class="code">P80_Date: 10,000 iterations</text>
    <text x="25" y="235" class="subtext">• Schedule contingency quantification</text>

    <rect x="15" y="265" width="250" height="45" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="285" class="label">MEP &amp; 4D BIM IFC4 Engine</text>
    <text x="25" y="298" class="subtext">• QS value-weighted earned value</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 640 250 L 680 250" class="arrow" />

  <!-- Stage 3 -->
  <g transform="translate(690, 100)">
    <rect width="270" height="330" class="box" />
    <rect x="15" y="15" width="70" height="18" rx="4" class="badge-green" />
    <text x="50" y="27" class="badge-text">STAGE 3</text>
    <text x="15" y="55" class="title">Power BI Telemetry Mesh</text>
    <text x="15" y="75" class="subtext">Live DAX &amp; Executive Cockpit</text>

    <rect x="15" y="95" width="240" height="70" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="115" class="label">Automated .pbix Generation</text>
    <text x="25" y="132" class="subtext">• S-Curve, EVM, Variance tracking</text>
    <text x="25" y="147" class="subtext">• Contractual claim defense tables</text>

    <rect x="15" y="175" width="240" height="70" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="195" class="label">Executive Board Dashboards</text>
    <text x="25" y="212" class="code">CPI = EV / AC; SPI = EV / PV</text>
    <text x="25" y="227" class="subtext">• Zero manual spreadsheet manipulation</text>

    <rect x="15" y="255" width="240" height="55" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="275" class="label">Audit-Proof Grounding</text>
    <text x="25" y="292" class="subtext">• Fully grounded contractual data</text>
  </g>
</svg>
